; SPDX-License-Identifier: MPL-2.0
; AMB-1 on the original M5Stack Cardputer (StampS3, 8 MB, no PSRAM): fm1-base's platform on the mvave-to-cardputer
; board layer (src/cp_fm1base*.c[pp], lib/mvave_cardputer). Build only; install into an M5Launcher slot.
; First: the generated headers in ../build/gen (base/tools/gen_font.py, gen_words.py; see CARDPUTER.md).

[platformio]
src_dir = src

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps = m5stack/M5Cardputer
lib_extra_dirs = lib
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCP_APP_STORE_NS=\"amb1\"
    -DTAPE_N=11025
    -DAMB_PLATE_SCALE=7409
    -I../app
    -I../app/dsp
    -I../base/include
    -I../base/device
    -I../base/lib
    -I../build/gen
    -ffp-contract=off
    -Wno-unused-function
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wl,-T$PROJECT_DIR/src/cp_pool.ld
build_src_filter =
    +<*>
    +<../../app/dsp/amb.c>
extra_scripts = post:tools/copy_bin.py
